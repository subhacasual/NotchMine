<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>NotchMine Search</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <div id="wrap">
    <span class="ear l" id="earL"></span><span class="ear r" id="earR"></span>
    <div id="box" role="dialog" aria-label="Search">
      <div class="bar">
        <i data-icon="search" class="bar-ic"></i>
        <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Search apps, files, maths, the web…" aria-label="Search" aria-controls="list">
        <div class="chips" id="chips" role="tablist" title="Tab switches">
          <button data-f="all" role="tab">All</button><button data-f="apps" role="tab">Apps</button><button data-f="files" role="tab">Files</button><button data-f="clip" role="tab">Clipboard</button>
        </div>
      </div>
      <div class="list" id="list" role="listbox"></div>
      <div class="pv" id="pv" hidden><div class="pv-wait"><span class="spin"></span><span id="pvTxt">Asking Google…</span></div></div>
      <div class="foot" id="foot"><span class="src" id="src"></span><span class="keys" id="keys"></span></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="common.js"></script>
  <script src="search.js"></script>
</body>
</html>
